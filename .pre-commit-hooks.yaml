- id: pydocfmt-check
  name: pydocfmt (check)
  description: 'Check Python docstrings and comments in Python and Markdown files with pydocfmt'
  entry: pydocfmt check
  language: python
  types_or: [python, pyi, markdown]
  files: (?i)\.(?:py|pyi|pyw|md)$
  minimum_pre_commit_version: '2.9.0'
  additional_dependencies: []

- id: pydocfmt-fix
  name: pydocfmt (fix)
  description: 'Format and check Python docstrings and comments in Python and Markdown files with pydocfmt'
  entry: pydocfmt check --fix
  language: python
  types_or: [python, pyi, markdown]
  files: (?i)\.(?:py|pyi|pyw|md)$
  minimum_pre_commit_version: '2.9.0'
  additional_dependencies: []
