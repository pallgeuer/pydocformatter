[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydocformatter"
version = "0.3.0"
description = "A Python annotation formatter for line-wrapping and formatting python comments and docstrings"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Rik Ghosh", email = "rikghosh487@gmail.com"},
    {name = "Philipp Allgeuer"},
]
maintainers = [
    {name = "Philipp Allgeuer"},
]
keywords = ["formatter", "docstring", "comment", "python", "code-quality", "linting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/pallgeuer/pydocformatter"
Repository = "https://github.com/pallgeuer/pydocformatter"
Issues = "https://github.com/pallgeuer/pydocformatter/issues"
Changelog = "https://github.com/pallgeuer/pydocformatter/blob/main/CHANGELOG.md"
Contributing = "https://github.com/pallgeuer/pydocformatter/blob/main/CONTRIBUTING.md"

[project.scripts]
pydocfmt = "pydocformatter.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]
dev = [
    {include-group = "test"},
    "black==26.3.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 200
target-version = ["py311"]
exclude = '/(\.github|\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|htmlcov|__pycache__|_build|buck-out|build|dist|tests/data)/'

[tool.isort]
profile = "black"
line_length = 200
known_first_party = ["pydocformatter"]
skip = [".github", ".eggs", ".git", ".hg", ".mypy_cache", ".tox", ".venv", "htmlcov", "__pycache__", "_build", "buck-out", "build", "dist", "tests/data"]

[tool.pydocfmt]
line-length = 120

[tool.mypy]
files = ["src/pydocformatter", "tests"]
show_error_codes = true
pretty = true
strict = true
