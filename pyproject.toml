#
# Project
#

[project]
name = "pydocformatter"
dynamic = ["version"]
authors = [{name = "Philipp Allgeuer"}]
maintainers = [{name = "Philipp Allgeuer"}]
description = "A Python linter and code formatter targeted at docstrings and comments."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
keywords = ["linter", "formatter", "docstring", "comment", "python", "code quality"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "filelock>=3.30.0",
    "libcst>=1.8.6",
]

[project.urls]
homepage = "https://github.com/pallgeuer/pydocformatter"
source = "https://github.com/pallgeuer/pydocformatter"
changelog = "https://github.com/pallgeuer/pydocformatter/blob/main/CHANGELOG.md"
documentation = "https://pallgeuer.github.io/pydocformatter/"
issues = "https://github.com/pallgeuer/pydocformatter/issues"

[project.scripts]
pydocfmt = "pydocformatter.cli.main:main"

#
# Groups and Extras
#

[dependency-groups]
docs = [
    "la-dev-codex-plugins==0.4.4",
    "zensical==0.0.53",
]
test = [
    {include-group = "docs"},
    "la-dev-codex-plugins[pytest]==0.4.4",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
]
dev = [
    {include-group = "test"},
    "pre-commit==4.6.1",
    # When updating Ruff or ty, compare their default exclude directories with each other and pydocformatter's DEFAULT_EXCLUDE.
    "ruff==0.16.1",
    "twine==7.0.0",
    "ty==0.0.66",
]

#
# Build
#

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydocformatter"]
exclude = [
    "/src/pydocformatter/rules/templates/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github/",
    "AGENTS.md",
    "CLAUDE.md",
    ".codex/",
    ".claude/",
]

[tool.hatch.version]
path = "src/pydocformatter/_version.py"

#
# pytest
#

[tool.pytest.ini_options]
addopts = ["-n", "auto"]
filterwarnings = ["error"]
testpaths = ["tests"]
la_dev_cwd_isolation_unmarked = "shared_guarded"
la_dev_cwd_isolation_cleanup = "pytest_retained"
tmp_path_retention_policy = "all"
tmp_path_retention_count = 3

#
# pydocfmt
#

[tool.pydocfmt]
line-length = 120
indent-style = "space"
indent-width = 4
line-ending = "lf"
respect-gitignore = true
force-exclude = true
extend-select = [
    "no-blank-line-after-function-docstring",
    "summary-trailing-period",
    "non-imperative-summary",
    "summary-starts-with-this",
    "missing-public-module-attribute-documentation",
    "attribute-documentation-order",
    "parameter-type-required",
    "return-type-required",
    "yield-type-required",
    "class-attribute-type-required",
    "module-attribute-type-required",
    "rule-codes-in-suppression-comments",
]
ignore = [
    "public-class-attribute-docstring-must-be-attached",
    "public-module-attribute-docstring-must-be-attached",
    "private-class-attribute-docstring-must-be-owner",
    "private-module-attribute-docstring-must-be-owner",
]
require-explicit = [
    "rule-codes-in-suppression-comments",
    "rule-names-in-suppression-comments",
]

[tool.pydocfmt.docstring]
convention = "google"
missing-documentation = "all-docstrings"
require-init-attribute-documentation = true

[tool.pydocfmt.comment]
detect-code = true
detect-expressions = true
join-standalone-lines = true
task-marker-mode = "hanging"

[tool.pydocfmt.per-file-ignores]
"tests/**/test_*.py" = ["PDF6"]

[tool.pydocfmt.per-file-settings]
"tests/**/test_*.py" = { docstring-missing-documentation = "has-section" }

#
# Ruff
#

[tool.ruff]
force-exclude = true
indent-width = 4
line-length = 200
output-format = "grouped"
preview = true
respect-gitignore = true
src = ["src", "tools"]

[tool.ruff.analyze]
preview = true

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
preview = true
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC",
    "B",
    "C4", "C90", "COM",
    "DTZ",
    "E", "EXE",
    "F", "FA", "FLY", "FURB",
    "G",
    "I", "ICN", "INP", "INT", "ISC",
    "LOG",
    "N",
    "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PYI",
    "RET", "RSE", "RUF",
    "S", "SIM", "SLOT",
    "T10", "TC", "TID", "TRY",
    "UP",
    "W",
    "YTT",
]
extend-select = [
    "boolean-positional-value-in-call",
]
ignore = [
    "D",
    "DOC",
    "any-type",
    "compare-to-empty-string",
    "doc-line-too-long",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "invalid-module-name",
    "line-too-long",
    "missing-trailing-comma",
    "multiple-leading-hashes-for-block-comment",
    "no-space-after-block-comment",
    "no-space-after-inline-comment",
    "over-indented",
    "prohibited-trailing-comma",
    "raise-vanilla-args",
    "read-whole-file",
    "start-process-with-partial-path",
    "suspicious-subprocess-import",
    "tab-indentation",
    "too-few-spaces-before-inline-comment",
    "unnecessary-dunder-call",
    "write-whole-file",
]
extend-unsafe-fixes = []
unfixable = []
dummy-variable-rgx = "^_$"
future-annotations = true
preview = true
task-tags = ["TODO", "FIXME", "XXX", "HACK", "BUG", "DEBUG", "NOTE", "OPTIMIZE", "REVIEW"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",
]
"tests/**/test_*.py" = [
    "private-member-access",
]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions", "collections.abc", "types", "pathlib"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.lint.isort]
combine-as-imports = false
force-sort-within-sections = false
known-first-party = ["tests"]
length-sort = false
length-sort-straight = true
lines-after-imports = 2
no-sections = false
order-by-type = true
split-on-trailing-comma = false

[tool.ruff.lint.isort.import-heading]
future = "Future imports"
standard-library = "Standard library imports"
third-party = "Third-party imports"
first-party = "First-party imports"
local-folder = "Local imports"

[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["[A-Z]", "[A-Z][A-Z]", "PDF_definition", "PCF_definition", "visit_*", "leave_*"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str", "bytes", "int"]
max-args = 20
max-bool-expr = 20
max-branches = 30
max-locals = 50
max-nested-blocks = 15
max-positional-args = 6
max-public-methods = 80
max-returns = 30
max-statements = 300
max-statements-in-try = 25

#
# ty
#

[tool.ty.src]
respect-ignore-files = true
