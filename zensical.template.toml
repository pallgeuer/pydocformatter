[project]
site_name = "pydocformatter"
site_description = "A Python linter and code formatter targeted at docstrings and comments."
site_url = "https://pallgeuer.github.io/pydocformatter/"
repo_url = "https://github.com/pallgeuer/pydocformatter"
repo_name = "pallgeuer/pydocformatter"
docs_dir = ".generated/zensical/docs"
site_dir = "site"
strict = true
use_directory_urls = true
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["js/extra.js"]
# __GENERATED_NAV__

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.path",
  "navigation.top",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "blue"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.validation]
omitted_files = "ignore"
absolute_links = "warn"
unrecognized_links = "warn"
anchors = "warn"
