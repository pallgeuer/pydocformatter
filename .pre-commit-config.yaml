repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: black (formatter)
        language_version: python3
        exclude: ^(build|dist|\.git|__pycache__|\.egg|doc|version)/

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (formatter)
        language_version: python3
        exclude: ^(build|dist|\.git|__pycache__|\.egg|doc|version)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        name: mypy (type checker)
        pass_filenames: false

  - repo: local
    hooks:
      - id: dependency-pin-check
        name: dependency pin/version consistency check
        entry: uv run python tools/check_dependency_pins.py
        language: system
        pass_filenames: false
      - id: pydocfmt
        name: pydocfmt (formatter)
        entry: uv run pydocfmt check --fix
        language: system
        types: [python]

  # Example of how external users would use pydocformatter hooks:
  # - repo: https://github.com/pallgeuer/pydocformatter
  #   rev: v0.3.0
  #   hooks:
  #     - id: pydocfmt
  #       args: [--line-length=88]
