name: Build and deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: docs

      - name: Sync docs dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Generate Zensical configuration
        run: uv run --no-sync python tools/docs/generate_zensical.py

      - name: Build documentation site
        run: uv run --no-sync zensical build --strict -f zensical.generated.toml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy documentation site
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
