name: Platform compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  hosted-tests:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x64
            runner: ubuntu-22.04
            python: "3.12"
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            python: "3.13"
          - name: Ubuntu 24.04 ARM64
            runner: ubuntu-24.04-arm
            python: "3.14"
          - name: macOS 14 ARM64
            runner: macos-14
            python: "3.14"
          - name: macOS 15 Intel
            runner: macos-15-intel
            python: "3.11"

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: tests-${{ matrix.runner }}-${{ matrix.python }}
          python-version: ${{ matrix.python }}

      - name: Sync development dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Run test suite
        run: uv run --no-sync pytest -n 0 -q

  ubuntu-20-04:
    name: Ubuntu 20.04 x64 / Python 3.11
    runs-on: ubuntu-24.04
    container: ubuntu:20.04

    steps:

      - name: Install operating-system prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes ca-certificates git passwd util-linux
          useradd --create-home --shell /bin/bash pydocfmt

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Prepare unprivileged test workspace
        run: chown --recursive pydocfmt:pydocfmt "$GITHUB_WORKSPACE"

      - name: Sync development dependencies as an unprivileged user
        run: runuser --user pydocfmt -- env --unset=UV_CACHE_DIR --unset=UV_PYTHON_INSTALL_DIR HOME=/home/pydocfmt PATH="$PATH" UV_PYTHON=3.11 uv sync --locked --no-default-groups --group dev

      - name: Run test suite as an unprivileged user
        run: runuser --user pydocfmt -- env --unset=UV_CACHE_DIR --unset=UV_PYTHON_INSTALL_DIR HOME=/home/pydocfmt PATH="$PATH" UV_PYTHON=3.11 uv run --no-sync pytest -n 0 -q

  alpine-musl:
    name: Alpine Linux musl x64 / Python 3.13
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run test suite in Alpine Linux
        run: |
          docker run --rm \
            --env PYDOCFMT_UID="$(id -u)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --entrypoint sh \
            ghcr.io/astral-sh/uv:python3.13-alpine \
            -c 'apk add --no-cache git && adduser -D -u "$PYDOCFMT_UID" pydocfmt && su pydocfmt -c "HOME=/home/pydocfmt UV_PYTHON=3.13 PYTHONDONTWRITEBYTECODE=1 git config --global --add safe.directory /workspace && HOME=/home/pydocfmt UV_PYTHON=3.13 PYTHONDONTWRITEBYTECODE=1 uv sync --locked --no-default-groups --group dev && HOME=/home/pydocfmt UV_PYTHON=3.13 PYTHONDONTWRITEBYTECODE=1 uv run --no-sync pytest -n 0 -q"'
